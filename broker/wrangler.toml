# Intermediário OAuth do Notion para o Orkio. Ver broker/README.md.
name = "orkio-oauth-broker"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# OAuth client ID da conexão do Notion (não é segredo).
NOTION_CLIENT_ID = ""
# Redirect URIs aceitos (separados por vírgula). Iguais aos cadastrados no Notion.
ALLOWED_REDIRECT_URIS = "http://localhost:47821/oauth/notion/callback"

# NOTION_CLIENT_SECRET NUNCA vai aqui. Configure com:
#   pnpm dlx wrangler secret put NOTION_CLIENT_SECRET
