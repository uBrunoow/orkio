# Release por tag. Dois caminhos: (1) merge na main (release-on-merge.yml cria a tag e dispara
# este workflow); (2) à mão: `pnpm release <patch|minor|major|beta>` + `git push --follow-tags`.
# vX.Y.Z → release estável; vX.Y.Z-beta.N → pre-release (canal beta).
# Os binários vão para os releases deste mesmo repositório (público), com o GITHUB_TOKEN do
# workflow (contents: write só nos jobs que publicam). Passo a passo em docs/releases.md.
name: Release

on:
  push:
    tags: ['v*.*.*']
  # Disparado pelo release-on-merge.yml com `--ref vX.Y.Z` (tags empurradas pelo GITHUB_TOKEN não
  # disparam o `push` acima). Sempre com a tag como ref: `$GITHUB_REF_NAME` é a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASES_REPO: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  # Cria o rascunho antes da matriz: os jobs do mac, do Windows e do Linux sobem para o mesmo
  # release (sem isso, eles poderiam criar rascunhos duplicados ao mesmo tempo).
  draft:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Criar o rascunho do release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          if state=$(gh release view "$tag" -R "$RELEASES_REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::O release $tag já foi publicado em $RELEASES_REPO. Lance uma versão nova."
              exit 1
            fi
            echo "Rascunho $tag já existe; os arquivos serão substituídos."
            exit 0
          fi
          node scripts/changelog-notes.mjs "$tag" > "$RUNNER_TEMP/notes.md"
          flags=(--draft --title "Orkio $tag" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$tag" -R "$RELEASES_REPO" "${flags[@]}"

  package:
    needs: [verify, draft]
    permissions:
      contents: write
    uses: ./.github/workflows/package.yml
    with:
      publish: true
    secrets: inherit

  # Só publica se todos os pacotes (e os smoke tests) passaram; senão o rascunho fica lá.
  finalize:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar o release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          node scripts/changelog-notes.mjs "$tag" > "$RUNNER_TEMP/notes.md"
          assets=$(gh release view "$tag" -R "$RELEASES_REPO" --json assets --jq '[.assets[].name] | join(" ")')
          # Pacotes e .yml do canal: a lista sai do manifesto (src/shared/release-artifacts.mts).
          expected=$(node scripts/release-assets.mjs "$tag")
          while IFS= read -r f; do
            case " $assets " in
              *" $f "*) ;;
              *) echo "::error::Falta o $f no rascunho $tag."; exit 1 ;;
            esac
          done <<< "$expected"
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          gh release edit "$tag" -R "$RELEASES_REPO" --draft=false --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          echo "Publicado: https://github.com/$RELEASES_REPO/releases/tag/$tag"
