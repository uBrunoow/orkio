# Mostra, na PR, a versão que sai ao mergear (patch sem rótulo; `release:minor|major|beta` escolhe;
# `release:none` não lança) e falha cedo se houver rótulos em conflito. Ver docs/releases.md.
name: Release (rótulo da PR)

# Mesmos caminhos ignorados pelo release-on-merge.yml: PR só disso não gera versão, então não há o
# que mostrar.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'broker/**'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: release-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: O que este rótulo lança
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          RELEASE_NOTE: ${{ github.event.pull_request.title }}
        run: node scripts/release-plan.mjs
