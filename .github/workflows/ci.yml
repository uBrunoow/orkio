# CI do app desktop (Electron). Roda na PR e é chamado pelo release.yml (workflow_call) antes de
# empacotar. Sem `push` na main: o merge já dispara o release, que roda este mesmo CI; rodar também
# no push duplicava tudo a cada merge. Mudanças só no site/ (site.yml) ou só em docs não rodam.
name: CI

on:
  pull_request:
    paths-ignore: ['site/**', 'docs/**', 'README.md', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install-deps
      # O E2E "app ↔ site" (@site) roda no workflow do site.
      - run: xvfb-run -a pnpm e2e --trace off --grep-invert @site

  # App empacotado (Linux, só pasta): abre na tela inicial e a ponte MCP roda de dentro do asar.
  # Pega quebras de empacotamento em todo PR sem gastar minutos de macOS/Windows.
  package-smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install-deps
      - run: pnpm dist:dir
      - run: xvfb-run -a pnpm smoke:packaged --trace off
