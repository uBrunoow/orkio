# CI do app desktop (Electron). Mudanças só no site/ não rodam este workflow (o site tem o site.yml).
# Também é chamado pelo release.yml (workflow_call) antes de empacotar.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  workflow_dispatch:
    inputs:
      macos:
        description: 'Rodar também o E2E no macOS (minutos de macOS custam 10x em repo privado)'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install-deps
      # O E2E "app ↔ site" (@site) roda no workflow do site.
      - run: xvfb-run -a pnpm e2e --trace off --grep-invert @site

  # App empacotado (Linux, só pasta): abre na tela inicial e a ponte MCP roda de dentro do asar.
  # Pega quebras de empacotamento em todo PR sem gastar minutos de macOS/Windows.
  package-smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install-deps
      - run: pnpm dist:dir
      - run: xvfb-run -a pnpm smoke:packaged --trace off

  # Opcional (workflow_dispatch com "macos"). O Keychain do runner pode pedir acesso: experimental.
  e2e-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos }}
    runs-on: macos-latest
    needs: checks
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e --trace off --grep-invert @site
