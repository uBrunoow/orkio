# Site (Next.js na Vercel). Separado do app: falhas aqui não afetam o workflow do app.
# O deploy é feito pela integração Vercel ↔ GitHub (Root Directory = site).
# Roda também quando muda o lado app do contrato (conectores, módulos compartilhados com o site, o
# E2E @site e o fixture): o teste de contrato e o E2E app ↔ site são os únicos que ligam os dois.
name: Site

on:
  push:
    branches: [main]
    paths: &contract
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'src/main/connectors/**'
      - 'src/main/platform/site.ts'
      - 'src/shared/site-contract.ts'
      - 'src/shared/github-names.ts'
      - 'src/shared/review-publish.ts'
      - 'src/shared/release-artifacts.mts'
      - 'src/shared/updates.ts'
      - 'test/site-contract.test.ts'
      - 'e2e/site-oauth.spec.ts'
      - 'e2e/fixtures.ts'
      - '.env.e2e'
  pull_request:
    paths: *contract

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Integração real: o app (build E2E) faz o login OAuth do Notion passando pelo site local.
  app-integration:
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: .
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site build
      # Valores e regras que app e site repetem (o ci.yml não roda em mudança só do site).
      - run: pnpm exec vitest run test/site-contract.test.ts
      - run: pnpm exec playwright install-deps
      # No CI (`CI=true`), sem o build do site o @site falha em vez de pular.
      - run: xvfb-run -a pnpm e2e --trace off --grep @site
